<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <clipPath id="card">
      <rect x="48" y="48" width="1104" height="534" rx="24" />
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="48" y="48" width="1104" height="534" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="48" y="48" width="16" height="534" fill="#59b39a" clip-path="url(#card)"/>

  <!-- Map icon: schools (blue dots) served by built sites (green), with connecting lines -->
  <g stroke="#cbd5e1" stroke-width="2">
    <line x1="480" y1="230" x2="600" y2="340"/>
    <line x1="520" y1="420" x2="600" y2="340"/>
    <line x1="700" y1="250" x2="740" y2="380"/>
  </g>
  <g fill="#0f172a">
    <circle cx="480" cy="230" r="12"/>
    <circle cx="520" cy="420" r="12"/>
    <circle cx="700" cy="250" r="12"/>
  </g>
  <g fill="#59b39a">
    <circle cx="600" cy="340" r="16"/>
    <circle cx="740" cy="380" r="16"/>
  </g>

  <text x="100" y="592" fill="#64748b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="22" font-weight="600">
    marimo
  </text>
</svg>
