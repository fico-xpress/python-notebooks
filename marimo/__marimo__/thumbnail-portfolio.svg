<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <clipPath id="card">
      <rect x="48" y="48" width="1104" height="534" rx="24" />
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="#edf4fb"/>
  <rect x="48" y="48" width="1104" height="534" rx="24" fill="#ffffff" stroke="#dbe5ef" stroke-width="2"/>
  <rect x="48" y="48" width="16" height="534" fill="#0a6de6" clip-path="url(#card)"/>

  <!-- Donut chart icon: portfolio composition -->
  <circle cx="600" cy="340" r="110" fill="none" stroke="#dbe5ef" stroke-width="40"/>
  <circle cx="600" cy="340" r="110" fill="none" stroke="#0a6de6" stroke-width="40"
          stroke-dasharray="290 400" stroke-linecap="butt" transform="rotate(-90 600 340)"/>
  <circle cx="600" cy="340" r="110" fill="none" stroke="#123554" stroke-width="40"
          stroke-dasharray="130 560" stroke-dashoffset="-290" stroke-linecap="butt" transform="rotate(-90 600 340)" opacity="0.7"/>

</svg>
