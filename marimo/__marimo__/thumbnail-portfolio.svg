<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <clipPath id="card">
      <rect x="48" y="48" width="1104" height="534" rx="24" />
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="48" y="48" width="1104" height="534" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="48" y="48" width="16" height="534" fill="#59b39a" clip-path="url(#card)"/>

  <!-- Donut chart icon: portfolio composition -->
  <circle cx="600" cy="340" r="110" fill="none" stroke="#e2e8f0" stroke-width="40"/>
  <circle cx="600" cy="340" r="110" fill="none" stroke="#59b39a" stroke-width="40"
          stroke-dasharray="290 400" stroke-linecap="butt" transform="rotate(-90 600 340)"/>
  <circle cx="600" cy="340" r="110" fill="none" stroke="#0f172a" stroke-width="40"
          stroke-dasharray="130 560" stroke-dashoffset="-290" stroke-linecap="butt" transform="rotate(-90 600 340)" opacity="0.7"/>

  <text x="100" y="592" fill="#64748b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="22" font-weight="600">
    marimo
  </text>
</svg>
