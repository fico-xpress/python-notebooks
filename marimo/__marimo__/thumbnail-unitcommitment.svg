<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <clipPath id="card">
      <rect x="48" y="48" width="1104" height="534" rx="24" />
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="48" y="48" width="1104" height="534" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="48" y="48" width="16" height="534" fill="#59b39a" clip-path="url(#card)"/>

  <!-- Stacked bars with demand line: power output per period -->
  <g opacity="0.85">
    <rect x="470" y="360" width="50" height="80" fill="#59b39a"/>
    <rect x="470" y="300" width="50" height="60" fill="#0f172a" opacity="0.7"/>
    <rect x="560" y="320" width="50" height="120" fill="#59b39a"/>
    <rect x="560" y="260" width="50" height="60" fill="#0f172a" opacity="0.7"/>
    <rect x="650" y="340" width="50" height="100" fill="#59b39a"/>
    <rect x="650" y="290" width="50" height="50" fill="#0f172a" opacity="0.7"/>
  </g>
  <polyline points="470,270 610,240 700,270" fill="none" stroke="#e11d48" stroke-width="4"/>

  <text x="100" y="592" fill="#64748b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="22" font-weight="600">
    marimo
  </text>
</svg>
